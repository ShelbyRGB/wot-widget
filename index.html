<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WoT Opponent Clan Widget</title>
    <style>
        body { font-family: 'Arial', sans-serif; color: white; background: transparent; margin: 0; padding: 10px; }
        .widget-box { background: rgba(15, 15, 15, 0.85); border: 2px solid #ff4400; border-radius: 6px; padding: 12px; width: 280px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .title { font-weight: bold; font-size: 15px; margin-bottom: 8px; text-transform: uppercase; color: #cccccc;}
        .clan-tag { color: #ffcc00; font-size: 18px; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px;}
        .value { color: #ffffff; font-weight: bold; }
        .highlight { color: #00ff66; }
    </style>
</head>
<body>

    <div class="widget-box" id="clanWidget">
        <div class="title">Противник: <span id="clanTag" class="clan-tag">Ожидание...</span></div>
        <div class="stat-row">ЭЛО (6 ур): <span id="elo6" class="value">-</span></div>
        <div class="stat-row">ЭЛО (8 ур): <span id="elo8" class="value">-</span></div>
        <div class="stat-row">ЭЛО (10 ур): <span id="elo10" class="value">-</span></div>
        <div style="border-top: 1px solid #444; margin: 6px 0;"></div>
        <div class="stat-row">Боёв за 28 дней: <span id="battles28" class="value highlight">-</span></div>
    </div>

    <!-- ИСПРАВЛЕНО: Ссылка теперь ведет на реальный рабочий файл библиотеки -->
    <script src="https://unpkg.com"></script>
    <script src="index.js" defer></script> 
</body>
</html>
