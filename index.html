<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WoT Opponent Clan Widget</title>
    <style>
        body { font-family: 'Arial', sans-serif; color: white; background: transparent; margin: 0; padding: 10px; }
        .widget-box { background: rgba(15, 15, 15, 0.85); border: 2px solid #ff4400; border-radius: 6px; padding: 12px; width: 280px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .title { font-weight: bold; font-size: 15px; margin-bottom: 8px; text-transform: uppercase; color: #cccccc;}
        .clan-tag { color: #ffcc00; font-size: 18px; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px;}
        .value { color: #ffffff; font-weight: bold; }
        .highlight { color: #00ff66; }
    </style>
</head>
<body>

    <div class="widget-box" id="clanWidget">
        <div class="title">Противник: <span id="clanTag" class="clan-tag">Поиск боя...</span></div>
        <div class="stat-row">ЭЛО (6 ур): <span id="elo6" class="value">-</span></div>
        <div class="stat-row">ЭЛО (8 ур): <span id="elo8" class="value">-</span></div>
        <div class="stat-row">ЭЛО (10 ур): <span id="elo10" class="value">-</span></div>
        <div style="border-top: 1px solid #444; margin: 6px 0;"></div>
        <div class="stat-row">Боёв за 28 дней: <span id="battles28" class="value highlight">-</span></div>
    </div>

    <!-- Подключаем библиотеку WotStat прямо сюда -->
    <script src="https://unpkg.com"></script>

    <script>
        const wotState = new WotStatWidget();
        const APP_ID = 'd565e587cfabd2567bce65b682753ea5'; 
        const API_URL = 'https://api.worldoftanks.eu';  

        let currentProcessedClanId = null;

        // 1. АВТОМАТИЧЕСКИЙ ОПРОС ИГРЫ КАЖДЫЕ 3 СЕКУНДЫ
        function forceCheckGameStatus() {
            try {
                const state = wotState.getState();
                
                if (state && state.arena && state.arena.opponents && state.arena.opponents.length > 0) {
                    // Ищем первого игрока, у которого мод заполнил данные клана
                    const realOpponent = state.arena.opponents.find(p => p && (p.clanId || p.clanID || p.clanTag));

                    if (realOpponent) {
                        const enemyClanId = realOpponent.clanId || realOpponent.clanID;
                        const enemyClanTag = realOpponent.clanTag;

                        // Если мод дал числовой ID — сразу запрашиваем укрепы
                        if (enemyClanId && enemyClanId !== currentProcessedClanId) {
                            currentProcessedClanId = enemyClanId;
                            document.getElementById('clanTag').innerText = `[${enemyClanTag}]`;
                            fetchClanStrongholdData(enemyClanId);
                        } 
                        // Если мод дал ТОЛЬКО текстовый тег — сначала ищем его ID через API по названию
                        else if (enemyClanTag && enemyClanTag !== currentProcessedClanId) {
                            currentProcessedClanId = enemyClanTag; 
                            document.getElementById('clanTag').innerText = `[${enemyClanTag}]...`;
                            searchClanIdByTag(enemyClanTag);
                        }
                    }
                } else {
                    // Если мы не в бою, аккуратно пишем статус ожидания
                    if (!currentProcessedClanId) {
                        document.getElementById('clanTag').innerText = 'Поиск боя...';
                        clearWidgetFields('Ожидание загрузки карты');
                    }
                }
            } catch (err) {
                console.error("Ошибка опроса мода:", err);
            }
        }

        // Запуск непрерывного таймера
        setInterval(forceCheckGameStatus, 3000);

        // 2. ФУНКЦИЯ ПОИСКА ID КЛАНА ПО ЕГО ТЕГСТОВОМУ ТЕГУ
        async function searchClanIdByTag(clanTag) {
            try {
                const response = await fetch(`${API_URL}/wot/clans/list/?application_id=${APP_ID}&search=${clanTag}`);
                const json = await response.json();

                if (json.status === 'ok' && json.data && json.data.length > 0) {
                    // Ищем точное совпадение тега среди результатов поиска
                    const exactClan = json.data.find(c => c.tag.toUpperCase() === clanTag.toUpperCase());
                    if (exactClan) {
                        fetchClanStrongholdData(exactClan.clan_id);
                    } else {
                        clearWidgetFields('Тег не совпал');
                    }
                } else {
                    clearWidgetFields('Клан по тегу не найден');
                }
            } catch (e) {
                clearWidgetFields('Ошибка поиска тега');
            }
        }

        // 3. ФУНКЦИЯ ПОЛУЧЕНИЯ ЭЛО И БОЕВ ПО ID КЛАНА
        async function fetchClanStrongholdData(clanId) {
            try {
                const response = await fetch(`${API_URL}/wot/stronghold/claninfo/?application_id=${APP_ID}&clan_id=${clanId}`);
                const json = await response.json();

                if (json.status === 'ok' && json.data[clanId]) {
                    const clanData = json.data[clanId];

                    document.getElementById('elo6').innerText = clanData.skirmish_6_elo_rating || 'Нет';
                    document.getElementById('elo8').innerText = clanData.skirmish_8_elo_rating || 'Нет';
                    document.getElementById('elo10').innerText = clanData.skirmish_10_elo_rating || 'Нет';

                    const battles6 = clanData.skirmish_6_battles_28 || 0;
                    const battles8 = clanData.skirmish_8_battles_28 || 0;
                    const battles10 = clanData.skirmish_10_battles_28 || 0;
                    document.getElementById('battles28').innerText = battles6 + battles8 + battles10;
                } else {
                    clearWidgetFields('Нет данных в укрепах');
                }
            } catch (error) {
                clearWidgetFields('Ошибка сети API');
            }
        }

        function clearWidgetFields(message) {
            document.getElementById('elo6').innerText = '-';
            document.getElementById('elo8').innerText = '-';
            document.getElementById('elo10').innerText = '-';
            document.getElementById('battles28').innerText = message;
        }
    </script>
</body>
</html>
